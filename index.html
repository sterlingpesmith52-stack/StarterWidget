<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Starter Widget</title>

<link rel="stylesheet" href="universal.css">

<style>
    :root {
        --mf-primary: #007AFF;
        --mf-primary-active: #005FCC;
        --mf-secondary: #000000;
        --mf-secondary-active: #222222;
        --mf-border: #ccc;
        --mf-text: #000;
    }

    body {
        margin: 0;
        padding: 20px;
        padding-bottom: 100px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: var(--mf-text);
    }

    .header-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 12px;
    }

    .logo {
        height: 32px;
        width: auto;
        object-fit: contain;
        margin-bottom: 6px;
    }

    .title {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 12px;
    }

    .container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 500px;
    }

    .button-row {
        display: flex;
        flex-direction: row;
        gap: 10px;
        align-items: center;
    }

    /* Brand Standard Buttons */
    button,
    .buy-btn {
        min-width: 120px;
        height: 44px;
        padding: 0 20px;
        font-size: 16px;
        font-weight: 500;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        box-sizing: border-box;
    }

    button {
        display: inline-block;
        width: auto;
    }

    .run-btn {
        background: var(--mf-primary);
        color: #fff;
    }

    .run-btn:hover,
    .run-btn:active {
        background: var(--mf-primary-active);
    }

    .clear-btn {
        background: var(--mf-secondary);
        color: #fff;
    }

    .clear-btn:hover,
    .clear-btn:active {
        background: var(--mf-secondary-active);
    }

    textarea {
        width: 100%;
        height: 110px;
        padding: 12px;
        font-size: 16px;
        border: 1px solid var(--mf-border);
        border-radius: 6px;
        resize: none;
        box-sizing: border-box;
    }

    textarea:focus {
        outline: none;
        border-color: #000;
    }

    .buy-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #ffffff;
        border-top: 1px solid var(--mf-border);
        padding: 14px 20px;
        display: flex;
        align-items: center;
        z-index: 999;
    }

    .buy-btn {
        background: var(--mf-primary);
        color: #fff;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .buy-btn:hover,
    .buy-btn:active {
        background: var(--mf-primary-active);
    }
</style>
</head>

<body>

    <div class="header-row">
        IMG_1741.jpeg
        <div class="title">Starter Widget</div>
    </div>

    <div class="container">

        <div class="button-row">
            <button class="run-btn" id="runBtn">Run</button>
            <button class="clear-btn" id="clearBtn">Clear</button>
        </div>

        <textarea
            id="inputBox"
            placeholder="Paste text here..."
        ></textarea>

    </div>

    <div id="buyFooter" class="buy-footer">
        /Payment/payment.html?tool=StarterWidget
            Buy This Tool
        </a>
    </div>

<script>
    const runBtn = document.getElementById("runBtn");
    const clearBtn = document.getElementById("clearBtn");
    const inputBox = document.getElementById("inputBox");

    runBtn.onclick = () => {
        alert("Run button pressed. (Add your logic here.)");
    };

    clearBtn.onclick = () => {
        inputBox.value = "";
    };

    const params = new URLSearchParams(window.location.search);
    const ownership = params.get("perimeter");

    if (ownership === "customerOwned") {
        const buyFooter = document.getElementById("buyFooter");

        if (buyFooter) {
            buyFooter.style.display = "none";
        }
    }
</script>

</body>
</html>
