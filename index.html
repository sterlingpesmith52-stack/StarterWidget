<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starter Widget</title>

<link rel="stylesheet" href="universal.css">

<style>
    body {
        background: #ffffff;
        margin: 0;
        padding: 20px;
        padding-bottom: 90px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Clarifier-standard header */
    .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        margin-bottom: 6px;
    }

    .header-left {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
    }

    .header-left img {
        height: 32px;
        width: auto;
        border-radius: 6px;
    }

    .tool-title {
        font-weight: bold !important;
        font-size: 28px;
        margin: 0;
        padding: 0;
        text-align: left;
    }

    .container {
        max-width: 500px;
    }

    /* Exact Clarifier button standard */
    .mf-button {
        width: auto;
        min-width: auto;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 14px;
        text-decoration: none;
        display: inline-block;
        border: none;
        cursor: pointer;
    }

    .action-button {
        background: #007aff;
        color: #fff;
    }

    .secondary-button {
        background: #000;
        color: #fff;
    }

    .button-row {
        margin-top: 12px;
        margin-bottom: 12px;
        display: flex;
        gap: 10px;
    }

    textarea {
        width: 100%;
        height: 150px;
        padding: 12px;
        box-sizing: border-box;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #ccc;
        resize: vertical;
    }

    .buy-footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: #ffffff;
        border-top: 1px solid #ccc;
        padding: 14px 20px;
        z-index: 1000;
    }
</style>
</head>

<body>

<div class="header-row">

    <div class="header-left">
        IMG_1741.jpeg
        <h1 class="tool-title">Starter Widget</h1>
    </div>

</div>

<div class="container">

    <div class="button-row">
        <button class="mf-button action-button" id="runBtn">Run</button>
        <button class="mf-button secondary-button" id="clearBtn">Clear</button>
    </div>

    <textarea
        id="inputBox"
        placeholder="Paste text here..."
    ></textarea>

</div>

<div id="buyFooter" class="buy-footer">
    /Payment/payment.html?tool=StarterWidget
       Buy This Tool
    </a>
</div>

<script>
const runBtn = document.getElementById("runBtn");
const clearBtn = document.getElementById("clearBtn");
const inputBox = document.getElementById("inputBox");

runBtn.onclick = () => {
    alert("Run button pressed. (Add your logic here.)");
};

clearBtn.onclick = () => {
    inputBox.value = "";
};

const perimeter = params.get("perimeter");

if (perimeter === "customerOwned") {
    const buyFooter = document.getElementById("buyFooter");
    if (buyFooter) {
        buyFooter.style.display = "none";
    }
}
</script>

</body>
</html>
